[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joff"
version = "0.1.0"
description = "Spec-first PyTorch experiment toolkit for simulation and process data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joff contributors" }]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
joff-paper-development = "joff.experiments.paper_development:main"
joff-paper-frozen = "joff.experiments.frozen_cli:main"

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
hdf5 = ["h5py>=3.10"]
parquet = ["pyarrow>=14.0"]
paper = ["seaborn>=0.13", "SciencePlots>=2.1"]
tracking = ["tensorboard>=2.14", "mlflow>=2.8"]
wandb = ["wandb>=0.16"]
hpo = ["optuna>=3.5"]
hydra = ["hydra-core>=1.3", "omegaconf>=2.3"]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["datasets/raw"]
