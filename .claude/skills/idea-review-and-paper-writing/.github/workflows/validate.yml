name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python -X utf8 scripts/validate_skill.py .
      - name: Validate forward-test fixture
        run: python -X utf8 -m json.tool tests/forward-tests.json > /dev/null
      - name: Smoke-test manuscript audit
        run: python -X utf8 scripts/audit_manuscript.py tests/fixtures
      - name: Smoke-test figure audit
        run: python -X utf8 scripts/audit_figures.py tests/fixtures/figures
