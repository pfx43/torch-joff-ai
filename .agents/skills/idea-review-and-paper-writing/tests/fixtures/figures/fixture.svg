<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img" aria-labelledby="title">
  <title id="title">Editable vector test fixture</title>
  <g id="model-block">
    <rect id="block" x="20" y="25" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#315b8a"/>
    <text id="label" x="60" y="55" text-anchor="middle" font-family="Arial" font-size="14">Model</text>
  </g>
  <g id="output-link">
    <line id="connector" x1="100" y1="50" x2="185" y2="50" stroke="#315b8a" stroke-width="2"/>
    <polygon id="arrowhead" points="185,50 175,44 175,56" fill="#315b8a"/>
    <text id="output-label" x="205" y="55" text-anchor="middle" font-family="Arial" font-size="14">y</text>
  </g>
</svg>
