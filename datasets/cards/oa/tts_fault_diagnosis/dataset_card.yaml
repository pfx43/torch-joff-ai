name: tts_fault_diagnosis
version: real-v1
description: Three-tank-system fault-diagnosis dataset.
access: {tag: oa, disclosure: open_access, license: to_verify}
adapter: TTSAdapter
files:
  root: ../../../raw/oa/TTS/fd
  train: train/[train].mat
  test: test/[test].mat
schema:
  sample_rate: 1.0
  feature_count: 7
  columns:
    - {name: time, role: time}
    - {name: x00, role: input}
    - {name: fault_id, role: fault_id}
tasks:
  fault_diagnosis:
    inputs: [input]
    targets: [fault_id]
    label_column: fault_id
    normal_label: 0
pipeline:
  split: {type: official}
  normalization: {method: standard}
